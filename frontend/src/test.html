<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Stream Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        video {
            width: 100%;
            max-width: 640px;
            height: auto;
            background: #000;
            border: 2px solid #333;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #status {
            margin: 20px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>WebRTC Camera Stream Test</h1>
    
    <div id="status">
        <p>Status: <span id="statusText">Not connected</span></p>
    </div>
    
    <div>
        <button onclick="connectAndStart()">Connect & Start Stream</button>
        <button onclick="stopStream()">Stop Stream</button>
    </div>
    
    <video id="videoElement" autoplay playsinline></video>
    
    <div id="log" style="margin-top: 20px; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; max-height: 200px; overflow-y: auto;">
        <h3>Log:</h3>
    </div>

    <script>
        let ws = null;
        let pc = null;
        let sessionId = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(text, type = 'info') {
            const statusText = document.getElementById('statusText');
            statusText.textContent = text;
            statusText.className = type;
        }
        
        async function connectAndStart() {
            try {
                // Connect to WebSocket
                log('Connecting to WebSocket...');
                updateStatus('Connecting...', 'info');
                
                ws = new WebSocket('ws://localhost:8000/ws/stream');
                
                ws.onopen = async () => {
                    log('WebSocket connected', 'success');
                    updateStatus('Connected to server', 'success');
                    
                    // Start session
                    log('Starting session...');
                    ws.send(JSON.stringify({
                        type: 'start_session',
                        mode: 'automatic',
                        camera_config: {
                            source: 'webcam',
                            resolution: '640x480',
                            fps: 30
                        }
                    }));
                };
                
                ws.onmessage = async (event) => {
                    const message = JSON.parse(event.data);
                    log(`Received: ${message.type}`);
                    
                    if (message.type === 'session_created') {
                        sessionId = message.session_id;
                        log(`Session created: ${sessionId}`, 'success');
                        await setupWebRTC();
                    } else if (message.type === 'answer') {
                        log('Received answer from server');
                        await pc.setRemoteDescription(new RTCSessionDescription(message));
                        updateStatus('Stream active', 'success');
                    } else if (message.type === 'error') {
                        log(`Error: ${message.message}`, 'error');
                        updateStatus(`Error: ${message.message}`, 'error');
                    }
                };
                
                ws.onerror = (error) => {
                    log(`WebSocket error: ${error}`, 'error');
                    updateStatus('Connection error', 'error');
                };
                
                ws.onclose = () => {
                    log('WebSocket disconnected');
                    updateStatus('Disconnected', 'info');
                };
                
            } catch (error) {
                log(`Failed to connect: ${error}`, 'error');
                updateStatus('Failed to connect', 'error');
            }
        }
        
        async function setupWebRTC() {
            try {
                log('Setting up WebRTC...');
                
                // Create peer connection
                pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' }
                    ]
                });
                
                // Handle incoming stream
                pc.ontrack = (event) => {
                    log('Received video track', 'success');
                    const video = document.getElementById('videoElement');
                    video.srcObject = event.streams[0];
                };
                
                // Handle ICE candidates
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        log('Sending ICE candidate');
                        ws.send(JSON.stringify({
                            type: 'ice_candidate',
                            session_id: sessionId,
                            candidate: event.candidate
                        }));
                    }
                };
                
                // Create data channel
                const dataChannel = pc.createDataChannel('results');
                dataChannel.onopen = () => log('Data channel opened', 'success');
                dataChannel.onmessage = (event) => {
                    log(`Data channel message: ${event.data}`);
                };
                
                // Create offer
                log('Creating offer...');
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                // Send offer to server
                ws.send(JSON.stringify({
                    type: 'offer',
                    session_id: sessionId,
                    sdp: offer.sdp
                }));
                
            } catch (error) {
                log(`WebRTC setup failed: ${error}`, 'error');
                updateStatus('WebRTC setup failed', 'error');
            }
        }
        
        function stopStream() {
            log('Stopping stream...');
            
            if (pc) {
                pc.close();
                pc = null;
            }
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                if (sessionId) {
                    ws.send(JSON.stringify({
                        type: 'stop_session',
                        session_id: sessionId
                    }));
                }
                ws.close();
            }
            
            const video = document.getElementById('videoElement');
            video.srcObject = null;
            
            updateStatus('Stopped', 'info');
            log('Stream stopped', 'success');
        }
    </script>
</body>
</html>
