[Service]
# CUDA Configuration for RTX A1000
Environment="CUDA_VISIBLE_DEVICES=0"
Environment="OLLAMA_CUDA_COMPUTE_CAP=8.6"
Environment="OLLAMA_GPU_MEMORY_FRACTION=0.90"
Environment="OLLAMA_NUM_GPU=999"
Environment="OLLAMA_DEBUG=1"
Environment="OLLAMA_FLASH_ATTENTION=1"

# CUDA Runtime Settings
Environment="CUDA_CACHE_DISABLE=0"
Environment="CUDA_LAUNCH_BLOCKING=0"
Environment="CUDA_DEVICE_ORDER=PCI_BUS_ID"
Environment="CUDA_MODULE_LOADING=EAGER"

# Library Path
Environment="LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"

# Restart policy
Restart=always
RestartSec=10